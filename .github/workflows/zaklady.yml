# Сторінки закладів (zaklady/) перезбираються з бази кабінету й заливаються на сайт, якщо щось змінилось.
# Головна сторінка бере заклади з бази сама й одразу; цей розклад потрібен лише для окремих сторінок закладів.
name: Сторінки закладів з бази

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: zaklady
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зібрати сторінки з бази
        run: python3 tools/build_zaklady.py . --from-base

      - name: Залити, якщо щось змінилось
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zaklady sitemap.xml
          if git diff --cached --quiet; then
            # GitHub вимикає розклад, якщо в репозиторії 60 днів без змін — раз на ~50 днів робимо порожній коміт
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 4320000 ]; then
              echo "Сторінки без змін"
              exit 0
            fi
            git commit --allow-empty -m "chore: підтримка розкладу оновлення сторінок"
          else
            git commit -m "chore: сторінки закладів з бази кабінету"
          fi
          git push
          # коміт від імені GitHub Actions сам не запускає збирання Pages — просимо його явно
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
